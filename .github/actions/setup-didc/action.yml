name: 'Setup didc'
description: Setup didc
runs:
  using: "composite"
  steps:
    - name: Install didc
      shell: bash
      run: |
        # Same pinned + sha256-verified binary the deploy scripts use.
        source scripts/didc-helpers.bash
        ensure_pinned_didc

        mkdir -p ~/.local/bin
        install -m 755 "$PINNED_DIDC" ~/.local/bin/didc
        ~/.local/bin/didc --version
        echo "$HOME/.local/bin" >> $GITHUB_PATH
