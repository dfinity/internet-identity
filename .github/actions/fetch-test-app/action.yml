name: "fetch-test-app"
description: Download the pinned dfinity/internet-identity-test-app release into .test-app/
inputs:
  token:
    description: >-
      Token used to read releases from dfinity/internet-identity-test-app. That
      repository is internal, so a workflow's default GITHUB_TOKEN cannot read
      it and a token belonging to an organisation member is required. Once that
      repository is public the default token is enough, and this input can be
      dropped along with the `token:` argument at each call site. Resolves to an
      empty string on a pull request from a fork, which receives no secrets;
      scripts/fetch-test-app reports that as the cause.
    required: true
runs:
  using: "composite"
  steps:
    - name: Fetch test app
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: scripts/fetch-test-app
