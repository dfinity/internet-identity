version: 2

# Non-major version updates for every ecosystem are consolidated into a single
# weekly pull request via `multi-ecosystem-groups`. Security updates are handled
# separately per ecosystem via `groups` with `applies-to: security-updates`, so
# advisory-driven bumps arrive as one grouped PR per ecosystem (across all
# directories) instead of one PR per dependency.
#
# `commit-message` and `open-pull-requests-limit` belong to the multi-ecosystem
# group: they describe the single consolidated PR, so Dependabot rejects them on
# the individual ecosystem entries.
multi-ecosystem-groups:
  weekly-version-updates:
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    labels:
      - dependencies
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope

updates:
  # ── cargo ──────────────────────────────────────────────
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/src/try-ii"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    patterns:
      - "*"
    multi-ecosystem-group: weekly-version-updates
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── npm ────────────────────────────────────────────────
  - package-ecosystem: npm
    directories:
      - "/"
      - "/src/sig-verifier-js"
      - "/src/test_openid_provider"
      - "/src/vite-plugins"
      - "/src/vc-api"
      - "/src/try-ii"
      - "/src/try-ii/src/try-ii-frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    patterns:
      - "*"
    multi-ecosystem-group: weekly-version-updates
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── github-actions ─────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Etc/UTC
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    patterns:
      - "*"
    multi-ecosystem-group: weekly-version-updates
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── docker ─────────────────────────────────────────────
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Etc/UTC
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    patterns:
      - "*"
    multi-ecosystem-group: weekly-version-updates
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
