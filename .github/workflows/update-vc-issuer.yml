# A GitHub Actions workflow that regularly creates a pull request bumping the
# pinned VC demo issuer release.
name: VC demo issuer update

on:
  schedule:
    # Check for a new issuer release every week
    - cron: "0 6 * * MON"
  workflow_dispatch:

jobs:
  vc-issuer-update:
    runs-on: ubuntu-latest
    steps:
      # Create app token (needed to create pull request)
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.PR_AUTOMATION_BOT_PUBLIC_APP_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_BOT_PUBLIC_PRIVATE_KEY }}

      # Checkout project
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-didc

      # Needed for `npm run generate:*-issuer` and the formatter step
      - run: npm ci

      - name: Bump the pinned issuer release
        run: ./scripts/update-vc-issuer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run the formatter so the regenerated bindings are formatted
      - run: npm run format

      # This action creates a PR only if there are changes.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          add-paths: |
            .github/versions/vc-issuer
            src/vc-api/vc_demo_issuer.did
            src/vc-api/src/generated/vc_issuer_types.ts
            src/frontend/src/lib/generated/vc_issuer_idl.js
          commit-message: "chore(fe): bump the pinned VC demo issuer release"
          committer: GitHub <noreply@github.com>
          branch: bot-vc-issuer-update
          delete-branch: true
          title: "chore(fe): bump the pinned VC demo issuer release"
          body: |
            Automated bump produced by `.github/workflows/update-vc-issuer.yml`.

            Moves `.github/versions/vc-issuer` to the latest release of
            https://github.com/dfinity/internet-identity-vc-demo-issuer,
            refreshes the vendored `src/vc-api/vc_demo_issuer.did` and
            regenerates the bindings derived from it.

      # Since this is a scheduled job, a failure won't be shown on any PR status.
      # To notify the team, we send a message to our Slack channel on failure.
      - name: Notify Slack on failure
        uses: ./.github/actions/slack
        if: ${{ failure() }}
        with:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MESSAGE: "VC demo issuer update failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
