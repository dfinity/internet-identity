# A GitHub Actions workflow that regularly creates a pull request bumping the
# pinned dfinity/internet-identity-test-app release.
name: Test app update

on:
  schedule:
    # Check for a new test app release every week
    - cron: "0 6 * * MON"
  workflow_dispatch:

jobs:
  update-test-app:
    runs-on: ubuntu-latest
    steps:
      # Create app token (needed to create pull request)
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.PR_AUTOMATION_BOT_PUBLIC_APP_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_BOT_PUBLIC_PRIVATE_KEY }}

      # Checkout project
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      # dfinity/internet-identity-test-app is an internal repository, which the
      # app token minted above cannot read — it is scoped to this repository.
      # Read its releases with an organisation member's token instead. Once that
      # repository is public, `secrets.GITHUB_TOKEN` is enough.
      - name: Check for a newer test app release
        id: update
        env:
          GH_TOKEN: ${{ secrets.GIX_BOT_PAT || secrets.GITHUB_TOKEN }}
        run: ./scripts/update-deps/update-test-app

      # This action creates a PR only if there are changes.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          add-paths: .github/versions/test-app
          commit-message: "chore(ci): update test app to ${{ steps.update.outputs.version }}"
          committer: GitHub <noreply@github.com>
          branch: bot-test-app-update
          delete-branch: true
          title: "chore(ci): update test app to ${{ steps.update.outputs.version }}"
          body: |
            Bumps the pinned [test app](https://github.com/dfinity/internet-identity-test-app)
            release to `${{ steps.update.outputs.version }}`.

            Produced by `.github/workflows/update-test-app.yml`. The e2e and
            deploy jobs fetch the pinned release through
            `scripts/fetch-test-app`, so CI on this pull request exercises the
            new build.

      # Since this is a scheduled job, a failure won't be shown on any PR status.
      # To notify the team, we send a message to our Slack channel on failure.
      - name: Notify Slack on failure
        uses: ./.github/actions/slack
        if: ${{ failure() }}
        with:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MESSAGE: "Test app update failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
