# Nextest configuration for Internet Identity canister tests.
# Each test creates its own PocketIC instance on the one PocketIC server CI
# starts, so tests run in parallel on every core. Retries absorb transient
# PocketIC failures.

# https://nexte.st/docs/configuration/reference/
[profile.ci]
test-threads = "num-cpus"
slow-timeout = { period = "180s", terminate-after = 3 }
retries = { backoff = "exponential", count = 2, delay = "2s", max-delay = "10s" }
leak-timeout = "2s"
