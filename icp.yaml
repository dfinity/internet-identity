# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v0.2.7/docs/schemas/icp-yaml-schema.json

canisters:
  - name: internet_identity_frontend
    build:
      steps:
        - type: script
          commands:
            - "scripts/render-local-init-args"
            - "II_FETCH_ROOT_KEY=1 scripts/build --frontend"
            - "cp internet_identity_frontend.wasm.gz \"$ICP_WASM_OUTPUT_PATH\""
    init_args:
      path: .icp/cache/init-args/internet_identity_frontend.did

  - name: internet_identity
    build:
      steps:
        - type: script
          commands:
            - "II_FETCH_ROOT_KEY=1 scripts/build"
            - "cp internet_identity.wasm.gz \"$ICP_WASM_OUTPUT_PATH\""
    init_args:
      path: src/internet_identity/local_test_arg.did

  # Built in dfinity/internet-identity-test-app; the pinned release is fetched
  # rather than built from source.
  - name: test_app
    build:
      steps:
        - type: script
          commands:
            - "scripts/fetch-test-app"
            - "cp .test-app/test_app.wasm \"$ICP_WASM_OUTPUT_PATH\""

  # The VC demo issuer lives in dfinity/internet-identity-vc-demo-issuer; we
  # install the release pinned in .github/versions/vc-issuer rather than
  # building it here.
  - name: issuer
    build:
      steps:
        - type: script
          commands:
            - "scripts/fetch-vc-issuer"
            - "cp .vc-issuer/vc_demo_issuer.wasm.gz \"$ICP_WASM_OUTPUT_PATH\""
    sync:
      steps:
        - type: script
          command: "scripts/provision-issuer"
