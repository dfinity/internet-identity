# A workspace of its own rather than a member of Internet Identity's: the
# vendored notification library needs ic-cdk 0.20, which that workspace does
# not resolve.
[workspace]

[package]
name = "notification_chat"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-asset-certification = "3.0.3"
ic-cdk = "0.20"
ic-http-certification = "3.0.3"
ic-stable-structures = "0.7"
# Vendored while the library repo is internal; see vendor/identity-notifications/README.md.
identity-notifications = { path = "vendor/identity-notifications" }
include_dir = "0.7"
serde = "1"
serde_json = "1"

[profile.release]
lto = true
opt-level = "z"
