<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notification chat</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header>
      <h1>Notification chat</h1>
      <span id="me" class="me"></span>
      <form id="claim" class="claim" hidden>
        <input
          id="name"
          type="text"
          placeholder="Claim a name"
          maxlength="32"
          autocomplete="off"
        />
        <button id="claim-btn" type="submit" disabled>Claim</button>
      </form>
      <button id="auth" class="auth" disabled>Loading…</button>
    </header>

    <main>
      <section class="chat">
        <div id="messages" class="messages"></div>
        <form id="compose" class="compose">
          <input
            id="text"
            type="text"
            placeholder="Sign in to chat"
            maxlength="500"
            autocomplete="off"
            disabled
          />
          <button id="send" class="send" type="submit" disabled>Send</button>
        </form>
      </section>
      <aside class="members">
        <h2>In the room</h2>
        <ul id="members"></ul>
      </aside>
    </main>

    <footer>
      <p id="status" class="status"></p>
      <button id="stats-toggle">Show notification stats</button>
      <div id="stats" class="stats" hidden></div>
    </footer>
  </body>
</html>
